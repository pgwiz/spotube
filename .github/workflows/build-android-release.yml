name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel / Theme (beta, stable, or nightly)'
        required: true
        type: choice
        default: 'beta'
        options:
          - beta
          - stable
          - nightly
      tag:
        description: 'Target GitHub Release tag to attach APK'
        required: true
        type: string
        default: 'v6.0.0-beta.1'

permissions:
  contents: write

env:
  COMPOSE_WEBVIEW_REPO: KRTirtho/ComposeNativeWebview
  COMPOSE_WEBVIEW_COMMIT: b11ac748de1219f9432338c067a2c5dafef3072a

jobs:
  build-android:
    name: Build Android (${{ inputs.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout spotube
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ComposeNativeWebview
        uses: actions/checkout@v4
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          path: compose-webview

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Publish compose-webview to mavenLocal
        working-directory: compose-webview
        run: |
          chmod +x gradlew
          mkdir -p src/jvmMain/resources/nucleus/native/linux-x64
          touch src/jvmMain/resources/nucleus/native/linux-x64/libcompose_webview_linux.so
          export GRADLE_OPTS="-Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=120000"
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt..."
            if ./gradlew publishToMavenLocal -x :webview-compose:buildNativeLinux -x :webview-compose:verifyPublicationCoordinates --no-daemon; then
              echo "Successfully published compose-webview to mavenLocal!"
              break
            fi
            echo "Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done

      - name: Configure Android signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "${{ github.workspace }}/composeApp/upload-keystore.jks"
            echo "release.signing.storeFile=${{ github.workspace }}/composeApp/upload-keystore.jks" >> composeApp/local.properties
            echo "release.signing.storePassword=${KEYSTORE_PASSWORD}" >> composeApp/local.properties
            echo "release.signing.keyAlias=${KEYSTORE_KEY_ALIAS}" >> composeApp/local.properties
            echo "release.signing.keyPassword=${KEYSTORE_KEY_PASSWORD}" >> composeApp/local.properties
          else
            echo "No custom keystore secret found, generating build keystore..."
            keytool -genkey -v -keystore "${{ github.workspace }}/composeApp/upload-keystore.jks" -alias spotube -keyalg RSA -keysize 2048 -validity 10000 -storepass spotubepass -keypass spotubepass -dname "CN=Spotube, OU=Mobile, O=Spotube, C=US"
            echo "release.signing.storeFile=${{ github.workspace }}/composeApp/upload-keystore.jks" >> composeApp/local.properties
            echo "release.signing.storePassword=spotubepass" >> composeApp/local.properties
            echo "release.signing.keyAlias=spotube" >> composeApp/local.properties
            echo "release.signing.keyPassword=spotubepass" >> composeApp/local.properties
          fi

      - name: Assemble Android Release APK
        run: |
          if [ "${{ inputs.channel }}" = "nightly" ]; then
            ./gradlew :composeApp:assembleNightlyRelease -Pnightly=true -PbuildNumber=${{ github.run_number }} --stacktrace
          else
            ./gradlew :composeApp:assembleStableRelease --stacktrace
          fi

      - name: Locate and Rename APK
        run: |
          APK_FILE=$(find composeApp/build/outputs/apk -path "*elease*" -name "*.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find composeApp/build/outputs/apk -name "*.apk" -type f | head -1)
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" Spotube-android-all-arch.apk
          ls -lh Spotube-android-all-arch.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotube-android-all-arch
          path: Spotube-android-all-arch.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: Spotube-android-all-arch.apk
